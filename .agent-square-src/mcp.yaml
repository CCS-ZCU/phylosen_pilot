# Neutral MCP registry. This is documentation/source material for future generators;
# clients continue using their existing native MCP configuration for now.
version: 1
servers:
  jupyter:
    transport: http
    url: http://127.0.0.1:4040/mcp
    scope: global
  jupyter-kernel:
    transport: stdio
    command: python
    args:
      - /home/jupyter-vojta/.agents/mcp/jupyter-kernel/server.py
    scope: global
  zotero:
    transport: stdio
    command: /home/jupyter-vojta/.local/zotero-mcp-venv/bin/zotero-mcp
    env:
      ZOTERO_LOCAL: "true"
    scope: global
